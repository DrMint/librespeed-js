# Publishes librespeed-js when a v* tag is pushed (or via workflow_dispatch).
# Auth: npm trusted publishing (OIDC) — no NPM_TOKEN.
#
# One-time setup (npmjs.com → package Settings → Trusted Publisher):
#   Provider: GitHub Actions
#   Organization: DrMint
#   Repository: librespeed-js
#   Workflow filename: publish.yml
#   Allowed action: npm publish
#
# Release flow:
#   1. npm run release:prep -- patch|minor|major
#   2. Commit, push main, wait for CI
#   3. git tag vX.Y.Z && git push origin vX.Y.Z
#      → this workflow publishes; release.yml creates the GitHub Release
#
# Triggered by tag push (not `release: published`): releases created with
# GITHUB_TOKEN do not start other workflows, so OIDC publish would never run.

name: Publish

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Trusted publishing needs a recent npm (bundled with Node 24+)
          node-version: "24"
          registry-url: https://registry.npmjs.org
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run build

      - name: Verify release tag matches package version
        run: |
          tag="${{ github.ref_name }}"
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="v$(node -p "require('./package.json').version")"
            echo "workflow_dispatch: using package version tag $tag"
          fi
          version="${tag#v}"
          if [[ "$tag" != v* ]]; then
            echo "Tag must look like v0.1.0 (got: $tag)"
            exit 1
          fi
          pkg_version=$(node -p "require('./package.json').version")
          if [[ "$pkg_version" != "$version" ]]; then
            echo "package.json is $pkg_version but tag is $tag (expected $version)"
            exit 1
          fi
          echo "ok librespeed-js@$pkg_version"

      - name: Publish
        run: npm publish --provenance --access public
